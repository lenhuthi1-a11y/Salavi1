<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo phiếu nhập kho</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background-color: #fff8fa; }
  .container { width: 850px; margin: 40px auto; background-color: #fff; padding: 20px 30px; border: 2px solid #f8b3c6; box-shadow: 0 2px 8px rgba(244,90,141,0.1); }
  h2 { text-align: center; margin-bottom: 20px; font-weight: bold; color: #f45a8d; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
  .col { flex: 1; min-width: 250px; }
  label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
  input, textarea { width: 100%; padding: 5px; border: 1px solid #f5a6be; font-size: 14px; margin-bottom: 10px; background-color: #fff8fa; box-sizing: border-box; }
  textarea { resize: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
  th, td { border: 1px solid #f5a6be; padding: 8px; text-align: center; vertical-align: middle; }
  th { background-color: #f45a8d; color: white; font-weight: bold; }
  tr:nth-child(even) { background-color: #fff8fa; }
  tfoot td { font-weight: bold; background-color: #fce4ec; color: #333; }
  .btn { padding: 6px 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-add { color: #fff; background-color: #f45a8d; border: 1px solid #f45a8d; }
  .btn-add:hover { background-color: #e04a7d; border-color: #e04a7d; }
  .btn-del { color: #fff; background-color: #dc3545; border: 1px solid #dc3545; }
  .btn-del:hover { background-color: #c82333; border-color: #c82333; }
  .btn-cancel { background-color: #dc3545; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; margin-left:10px; cursor: pointer; float: right;}
  .btn-save { background-color: #004080; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; float: right; }
  .btn-cancel:hover { background-color: #c82333; }
  .btn-save:hover { background-color: #003366; }
  td.editable { cursor: text; min-height: 20px; }
  td.editable:focus { outline: 1px solid #f45a8d; }
  .clearfix::after { content: ""; display: block; clear: both; }
</style>
<!-- Thêm thư viện XLSX để đọc file Excel -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body>
<div class="container">
  <h2>PHIẾU NHẬP KHO</h2>

  <form method="post" action="{% url 'tao_phieu_nhap' %}" id="phieuForm">
    {% csrf_token %}
    <div class="row">
      <div class="col">
        <label>Nguồn nhập</label>
        <input type="text" id="nguonNhap" name="nguon_nhap">
        <label>Mã nguồn</label>
        <input type="text" id="maNguon" name="ma_nguon">
        <label>Số điện thoại</label>
        <input type="text" id="sdt" name="sdt">
        <label>Địa chỉ</label>
        <input type="text" id="diaChi" name="dia_chi">
      </div>
      <div class="col">
        <label>Mã phiếu nhập</label>
        <input type="text" id="maPhieu" name="ma_phieu">
        <label>Lý do nhập</label>
        <textarea id="lyDo" name="ly_do" rows="4"></textarea>
      </div>
    </div>

    <table id="hangTable">
      <thead>
        <tr>
          <th>STT</th>
          <th>Tên hàng hóa</th>
          <th>Mã hàng hóa</th>
          <th>Đơn vị</th>
          <th>Đơn giá</th>
          <th>Số lượng</th>
          <th>Chiết khấu</th>
          <th>Thành tiền</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td colspan="7" style="text-align:right;">Tổng cộng:</td>
          <td id="tongTien">0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <!-- Nút thêm hàng hóa bình thường -->
    <button type="button" class="btn btn-add" onclick="themDong()">+ Thêm hàng hóa</button>
    <!-- Nút thêm hàng từ file Excel -->
    <button type="button" id="btnThemFile" class="btn btn-add">+ Thêm hàng từ file ngoài</button>

    <input type="hidden" name="tong_tien" id="tongTienInput">

    <div class="clearfix" style="margin-top:20px;">
      <button type="button" class="btn-cancel" onclick="huyPhieu()">Hủy</button>
      <button type="submit" class="btn-save">💾 Lưu phiếu nhập</button>
    </div>
  </form>
</div>

<!-- Popup chọn file đẹp, giống hình bạn gửi -->
<div id="popupFile" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
     width: 500px; background-color: #fff; border: 1px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 999; border-radius: 6px;">

  <!-- Thanh tiêu đề màu hồng -->
  <div style="background-color:#f45a8d; padding:10px 15px; border-top-left-radius:6px; border-top-right-radius:6px; color:#fff; font-weight:bold;">
    THÊM DANH SÁCH HÀNG HÓA TỪ FILE NGOÀI
  </div>

  <!-- Nội dung popup -->
  <div style="padding:20px; text-align:center;">
    <div id="dropArea" style="border:2px dashed #ccc; padding:40px 20px; margin-bottom:15px; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="font-size:40px; color:#4a90e2; margin-bottom:10px;">&#x2B06;</div>
      <div>Kéo thả file vào đây</div>
      <div style="margin:5px 0;">hoặc</div>

      <!-- Nút chọn file custom, không hiện No file chosen -->
      <label for="fileInput" style="padding:10px 20px; background-color:#f8b868; border-radius:4px; cursor:pointer; display:inline-block;">
        Chọn file
      </label>
      <input type="file" id="fileInput" style="display:none;">
    </div>

    <button type="button" class="btn-cancel" onclick="closePopup()" style="background-color:#dc3545; color:#fff; padding:8px 20px; border:none; border-radius:4px; cursor:pointer;">
      Hủy
    </button>
  </div>
</div>



<!-- ====================== SCRIPT PHẦN DƯỚI ====================== -->
<script>
let stt = 1;

function themDong(){
  const tbody = document.querySelector('#hangTable tbody');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td>${stt++}</td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="true"></td>
    <td class="editable" contenteditable="false"></td>
    <td><button class="btn-del" type="button" onclick="xoaDong(this)">X</button></td>
  `;
  tbody.appendChild(row);

  row.cells[4].addEventListener('input', ()=>tinhThanhTien(row));
  row.cells[5].addEventListener('input', ()=>tinhThanhTien(row));
  row.cells[6].addEventListener('input', ()=>tinhThanhTien(row));
}

function xoaDong(btn){
  const row = btn.closest('tr');
  row.remove();
  capNhatSTT();
  tinhTong();
}

function capNhatSTT(){
  const rows = document.querySelectorAll('#hangTable tbody tr');
  stt = 1;
  rows.forEach(r => r.cells[0].textContent = stt++);
}

function tinhThanhTien(row){
  const donGia = parseFloat(row.cells[4].textContent.replace(/,/g,''))||0;
  const soLuong = parseFloat(row.cells[5].textContent)||0;
  const chietKhau = parseFloat(row.cells[6].textContent.replace('%',''))||0;
  const thanhTien = donGia * soLuong * (1 - chietKhau/100);
  row.cells[7].textContent = thanhTien ? thanhTien.toLocaleString() : '';
  tinhTong();
}

function tinhTong(){
  const rows = document.querySelectorAll('#hangTable tbody tr');
  let tong = 0;
  rows.forEach(row => {
    tong += parseFloat(row.cells[7].textContent.replace(/,/g,''))||0;
  });
  document.getElementById('tongTien').textContent = tong.toLocaleString();
  document.getElementById('tongTienInput').value = tong;
}

function huyPhieu(){
  if(confirm("Bạn có chắc chắn muốn hủy phiếu?")) location.href = "/nhapkho";
}

// Làm sạch dấu phẩy trước khi gửi
document.querySelector("form").addEventListener("submit", function() {
  const tongTienInput = document.querySelector("[name='tong_tien']");
  if (tongTienInput) tongTienInput.value = tongTienInput.value.replace(/,/g, '');
});

// Tạo input ẩn chứa dữ liệu hàng hóa khi gửi form
document.getElementById('phieuForm').addEventListener('submit', function(e) {
  const rows = document.querySelectorAll('#hangTable tbody tr');
  rows.forEach(row => {
    const data = {
      ten_hang: row.cells[1].textContent.trim(),
      ma_hang: row.cells[2].textContent.trim(),
      don_vi: row.cells[3].textContent.trim(),
      don_gia: row.cells[4].textContent.trim(),
      so_luong: row.cells[5].textContent.trim(),
      chiet_khau: row.cells[6].textContent.trim(),
      thanh_tien: row.cells[7].textContent.trim()
    };
    for (const key in data) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = data[key];
      e.target.appendChild(input);
    }
  });
});

// ================= Thêm hàng từ file Excel =================

// Mở popup
document.getElementById('btnThemFile').addEventListener('click', ()=> {
  document.getElementById('popupFile').style.display = 'block';
});

function closePopup() {
  document.getElementById('popupFile').style.display = 'none';
}

// Xử lý file Excel
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file) readExcelFile(file);
});

function readExcelFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type:'array'});
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonData = XLSX.utils.sheet_to_json(firstSheet);

    jsonData.forEach(row => {
      themDongTuFile(row.ten_hang, row.ma_hang, row.don_vi, row.don_gia, row.so_luong, row.chiet_khau);
    });
  };
  reader.readAsArrayBuffer(file);
}

function themDongTuFile(ten, ma, dv, dg, sl, ck){
  const tbody = document.querySelector('#hangTable tbody');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td></td>
    <td class="editable" contenteditable="true">${ten||''}</td>
    <td class="editable" contenteditable="true">${ma||''}</td>
    <td class="editable" contenteditable="true">${dv||''}</td>
    <td class="editable" contenteditable="true">${dg||''}</td>
    <td class="editable" contenteditable="true">${sl||''}</td>
    <td class="editable" contenteditable="true">${ck||''}</td>
    <td class="editable" contenteditable="false"></td>
    <td><button class="btn-del" type="button" onclick="xoaDong(this)">X</button></td>
  `;
  tbody.appendChild(row);
  capNhatSTT();
  tinhThanhTien(row);

  row.cells[4].addEventListener('input', ()=>tinhThanhTien(row));
  row.cells[5].addEventListener('input', ()=>tinhThanhTien(row));
  row.cells[6].addEventListener('input', ()=>tinhThanhTien(row));

  closePopup();
}
</script>
</body>
</html>
